<!DOCTYPE html>
<html>
    <head><title>Student Registration</title></head>
    <body>
        <h1>Student Registration Form</h1>
        <form>
            Name:
            <input type="text" name="" id="">
            <br><br>
            Password:
            <input type="password" name="" id="">
            <br><br>
            Email:
            <input type="email" name="" id="">
            <br><br>
            Gender:
            <input type="radio" value="male" name="gender">
            male
            <input type="radio" value="female" name="gender">
            female
            <br><br>

            Skills:
            <input type="checkbox" name="skill" value="HTML">
            HTML
            <input type="checkbox" name="skill" value="css">
            CSS
            <input type="checkbox" name="skill" value="javas">
            Javascript
            <br><br>

            Department:
            <select name="department" >
                <option value="">CSE</option>
                <option value="">CSEu</option>
                <option value="">CSEt</option>
                <option value="">CSEr</option>
                <option value="">CSEy</option>
            </select>
            <br><br>
            Address:
            <br>
            <textarea name="address" rows="5" cols="40" id=""></textarea>
            <br><br>
            <input type="submit" value="submit">
            <input type="reset" value="reset">

            
        </form>
    </body>
</html>
