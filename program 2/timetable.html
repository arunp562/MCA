<!DOCTYPE html>
<html>
    <head>
        <title>Time Table</title>
        <style>
                body{
                    font-family: Arial, Helvetica, sans-serif;
                    background-color: #fafafa;
                    padding: 20px;
                }
                h2{
                    text-align: center;
                    background: #444;
                    color: #fff;
                    padding: 10px;
                    border-radius: 6px;
                }
                table{
                    border-collapse: collapse;
                    margin: 20px auto;
                    width: 80%;
                }
                th,td{
                    border: 1px solid #999;
                    padding: 12px;
                    text-align: center;
                } 
                th{
                    background-color: #91cdea;
                }
                td{
                    background-color: #f1faff;
                }
        </style>
    </head>
    <body>
        <h2>Weekly Time Table</h2>
        <table>
            <tr>
                <th>day</th>
                <th>9-10 AM</th>
                <th>10-11 AM</th>
                <th>11-12 PM</th>
            </tr>
            <tr>
                <td>Mnday</td>
                <td>ADS</td>
                <td>MATHS</td>
                <td>ASE</td>
            </tr>
            <tr>
                <td>DF</td>
                <td>WPL</td>
                <td>MATHS</td>
                <td>PL</td>
            </tr>
        </table>
        <p style="text-align: center;"><a href="home.html">Back to home page</a></p>
    </body>
</html>
